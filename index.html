<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTH1W — Mathematics 9</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230284c7'/%3E%3Ctext x='32' y='43' font-size='26' font-family='Verdana,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E1W%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════ MTH1W — MATHEMATICS 9 ═══════════ */

:root{
  --bg:#eef6fb;--bgrgb:238,246,251;--surface:#ffffff;--sf:255,255,255;--hover:#f4fafd;
  --ink:#0f2233;--t2:#35506a;--t3:#6e89a3;--t4:#a3bcd1;
  --bdr:#d9e8f2;--bdr2:#bfd8e8;
  --accent:#0284c7;--accent-2:#0ea5e9;--accent-fg:#ffffff;
  --accent-dim:rgba(2,132,199,.08);--accent-bdr:rgba(2,132,199,.3);
  --ans:#cc3344;--vid:#a8498f;--eqao:#1e40af;--done:#1f8a63;--skills:#0f8577;
  --haz-bg:#fff6e5;--haz-fg:#9a5a00;--haz-bdr:rgba(190,120,0,.35);
  --warn-bg:#fff0f2;--warn-fg:#b32642;--warn-bdr:rgba(204,51,68,.3);
  --test-bg:rgba(176,72,84,.06);--quiz-bg:rgba(2,132,199,.05);--pquiz-bg:rgba(2,132,199,.05);--review-bg:rgba(2,132,199,.035);
  --test-fg:#b04854;--test-dim:rgba(176,72,84,.09);--test-bdr:rgba(176,72,84,.35);
  --r:10px;--sh:0 1px 2px rgba(15,34,51,.06);--sh2:0 1px 3px rgba(15,34,51,.06),0 6px 20px rgba(15,34,51,.07);
  --topbar:rgba(238,246,251,.8);
  --curve:2,132,199;--curve-a:.16;--aur:.42;
  --pal-sk:2,132,199;--pal-vi:120,80,220;--pal-co:214,66,86;--pal-am:196,120,0;--pal-gn:31,138,99;--pal-tq:14,116,144;
  --sans:'Outfit',"Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:'IBM Plex Mono',"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#08131d;--bgrgb:8,19,29;--surface:#0e1d2b;--sf:14,29,43;--hover:#14273a;
  --ink:#d7e6f2;--t2:#8fadc6;--t3:#5a7893;--t4:#33495d;
  --bdr:#16293b;--bdr2:#224055;
  --accent:#38bdf8;--accent-2:#7dd3fc;--accent-fg:#06202f;
  --accent-dim:rgba(56,189,248,.12);--accent-bdr:rgba(56,189,248,.32);
  --ans:#ff8f9d;--vid:#d576c0;--eqao:#8fa8ff;--done:#43c79f;--skills:#3fd2bd;
  --haz-bg:#33260f;--haz-fg:#ffc65c;--haz-bdr:rgba(255,198,92,.35);
  --warn-bg:#33202a;--warn-fg:#ff9fae;--warn-bdr:rgba(255,143,157,.3);
  --test-bg:rgba(224,122,140,.07);--quiz-bg:rgba(56,189,248,.07);--pquiz-bg:rgba(56,189,248,.07);--review-bg:rgba(56,189,248,.045);
  --test-fg:#e07a8c;--test-dim:rgba(224,122,140,.12);--test-bdr:rgba(224,122,140,.4);
  --sh:0 1px 3px rgba(0,0,0,.3);--sh2:0 2px 8px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --topbar:rgba(8,19,29,.8);
  --curve:56,189,248;--curve-a:.15;--aur:.6;
  --pal-sk:56,189,248;--pal-vi:170,145,255;--pal-co:255,122,135;--pal-am:255,190,80;--pal-gn:95,207,138;--pal-tq:69,200,224;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);line-height:1.6;min-height:100vh;
  background-image:radial-gradient(1000px 520px at 82% -8%,var(--accent-dim),transparent 70%);
  background-repeat:no-repeat;background-attachment:fixed;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;animation:fadein 1.4s both}
/* The cursor (see the script at the end): an SVG overlay above everything */
#vcur{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:1000;pointer-events:none;overflow:visible;display:none;opacity:0;transition:opacity .2s}
body.vc #vcur{display:block}
#vcur.on{opacity:1}
#vcur.hid{opacity:0}
#vcur .lbl{font-family:var(--mono);font-size:10px;font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;transition:opacity .15s}
#vcur .pt{stroke:var(--bg);stroke-width:1.2;transition:transform .12s;transform-origin:center;transform-box:fill-box}
#vcur.dn .pt{transform:scale(1.5)}
#vcur .tailh{stroke:var(--bg);stroke-width:5;stroke-linecap:round;opacity:.8}
#vcur .tail{stroke-linecap:round}
@media(hover:hover) and (pointer:fine){body.vc,body.vc *{cursor:none!important}body.vc input,body.vc textarea{cursor:auto!important}}
.page{max-width:1080px;margin:0 auto;padding:2.5rem 1.5rem 4rem;position:relative;z-index:1}

/* Today hero — click it to jump to that day in the table */
.hero{background:linear-gradient(135deg,var(--accent-dim),transparent 60%),rgba(var(--sf),.9);
  border:1px solid var(--accent-bdr);border-radius:var(--r);padding:.9rem 1.35rem;margin-bottom:1.4rem;
  position:relative;overflow:hidden;box-shadow:var(--sh2);cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease}
@media(hover:hover){.hero:hover{transform:scale(1.013);box-shadow:0 0 0 3px var(--accent-dim),var(--sh2)}}
.hero:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero::after{content:"9";position:absolute;right:1rem;bottom:-1.3rem;font-size:5.5rem;font-weight:700;font-style:italic;
  color:var(--accent);opacity:.07;font-family:Georgia,serif;pointer-events:none;transition:opacity .2s}
.hero:hover::after{opacity:.13}
.hero .eyebrow{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:.5rem}
.hero .eyebrow .live{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);position:relative}
.hero .eyebrow .live::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--accent);opacity:0;animation:livepulse 2.6s ease-out infinite}
@keyframes livepulse{0%{transform:scale(.7);opacity:.7}70%{transform:scale(2.4);opacity:0}100%{transform:scale(2.4);opacity:0}}
.hero h2{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;margin:.25rem 0 .6rem;text-wrap:balance;transition:color .2s,letter-spacing .2s}
.hero:hover h2{color:var(--accent);letter-spacing:0}
.hero .acts{display:flex;flex-wrap:wrap;gap:.5rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:600;padding:.45rem .95rem;border-radius:8px;
  border:1px solid transparent;cursor:pointer;transition:transform .15s,opacity .15s;font-family:var(--sans)}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.ansb{background:transparent;border-color:var(--warn-bdr);color:var(--ans)}
.btn.ghost{background:transparent;border-color:var(--bdr2);color:var(--t2)}
.btn.dis{background:transparent;border-color:var(--bdr);color:var(--t4);cursor:default}
.btn.dis:hover{transform:none}

.top-bar{position:sticky;top:0;z-index:100;background:var(--topbar);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bdr);margin:-2.5rem -1.5rem 2rem;padding:.6rem 1.5rem;
  display:flex;align-items:center;gap:.8rem}
.top-bar .lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
.ptrack{flex:1;height:3px;background:var(--bdr);border-radius:2px;overflow:hidden}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:2px;transition:width .6s}
.ptxt{font-family:var(--mono);font-size:.65rem;color:var(--accent);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

header{margin-bottom:1.8rem}
.htop{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.6rem;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);
  padding:.22rem .65rem;border:1px solid var(--accent-bdr);border-radius:100px;background:var(--accent-dim);font-weight:600}
.hacts{display:flex;gap:.4rem;position:relative}
.help{position:absolute;right:0;top:calc(100% + 8px);z-index:150;width:min(320px,calc(100vw - 2rem));background:var(--surface);border:1px solid var(--bdr2);
  border-radius:var(--r);box-shadow:var(--sh2);padding:.85rem 1rem;display:flex;flex-direction:column;gap:.55rem;font-size:.78rem;color:var(--t2);text-align:left;
  opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .15s,transform .15s,visibility 0s .15s}
.help.open{opacity:1;visibility:visible;transform:none;transition:opacity .15s,transform .15s}
.help .ht{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);font-weight:600;margin-bottom:.1rem}
.help .hi{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.help .hi .dlink,.help .hi .newp,.help .hi .xans{pointer-events:none}
.help .hi small{color:var(--t3);font-size:.72rem}
.help .swatch{width:14px;height:14px;border-radius:4px;background:var(--accent-dim);box-shadow:inset 3px 0 0 var(--accent);flex-shrink:0}
.hbtn{font-family:var(--mono);font-size:.65rem;color:var(--t3);cursor:pointer;background:rgba(var(--sf),.72);
  border:1px solid var(--bdr);padding:.24rem .7rem;border-radius:100px;transition:all .2s}
.hbtn:hover{color:var(--t2);border-color:var(--bdr2);background:var(--hover)}
.hbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header h1{font-size:2.5rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--ink);text-wrap:balance}
header h1 em{font-style:normal;color:var(--accent)}
header .sub{color:var(--t3);font-size:.88rem;margin-top:.35rem}
/* Course essentials: the outline, the homework routine and the calculator list, pinned under the title */
.ess{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.95rem}
.ess a{display:inline-flex;align-items:center;gap:.42rem;font-size:.78rem;font-weight:600;padding:.42rem .9rem;border-radius:100px;
  background:rgba(var(--sf),.78);border:1px solid var(--bdr2);color:var(--t2);box-shadow:var(--sh);
  transition:transform .15s,border-color .15s,color .15s,box-shadow .15s}
.ess a:hover{transform:translateY(-1px);border-color:var(--accent-bdr);color:var(--accent);box-shadow:var(--sh2)}
.ess a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ess .ico{width:1.05em;height:1.05em}

.sbar{display:flex;align-items:center;gap:.6rem;margin-bottom:1.2rem;padding:.55rem .9rem;background:rgba(var(--sf),.72);
  border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.sbar:focus-within{border-color:var(--accent-bdr);box-shadow:0 0 0 3px var(--accent-dim)}
.sbar .si{color:var(--t4);font-size:.9rem}
.sbar input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:var(--sans);font-size:.85rem}
.sbar input::placeholder{color:var(--t4)}
.sbar .sc{font-family:var(--mono);font-size:.62rem;color:var(--t3);white-space:nowrap}
.sbar .sc:empty{display:none}
.nomatch-msg{text-align:center;color:var(--t3);font-size:.85rem;padding:2rem 1rem;border:1px dashed var(--bdr2);border-radius:var(--r);margin-bottom:.55rem}
.unit.nomatch{display:none}

/* Units are glass: the background shows through. Each row carries its own
   opacity (--ra0, set per day in dayRow): today and test days are solid,
   the days either side nearly so, the rest fade with distance, past days
   most of all. Hovering a row firms it up. */
@property --ra{syntax:"<number>";inherits:true;initial-value:.5}
@property --tint{syntax:"<color>";inherits:true;initial-value:transparent}
.unit{margin-bottom:.55rem;border:1px solid var(--bdr);border-radius:var(--r);background:rgba(var(--sf),.34);
  box-shadow:var(--sh);transition:border-color .25s,box-shadow .25s}
.unit:hover{border-color:var(--bdr2);box-shadow:var(--sh2)}
.unit.current{border-color:var(--accent-bdr);box-shadow:0 0 0 3px var(--accent-dim),var(--sh2)}
.uhead{display:flex;align-items:center;gap:.8rem;padding:.9rem 1.15rem;cursor:pointer;user-select:none;transition:background .15s,box-shadow .2s;width:100%;background:rgba(var(--sf),.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;text-align:left;font-family:inherit;color:inherit;
  border-radius:var(--r);position:sticky;top:var(--tbh,44px);z-index:5}
.unit.open .uhead{border-radius:var(--r) var(--r) 0 0}
.uhead.stuck{box-shadow:inset 0 -1px 0 var(--bdr),0 8px 16px -10px rgba(0,0,0,.3)}
.uhead:hover{background:var(--hover)}
.uhead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.unum{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t4);font-weight:600;white-space:nowrap}
.current .unum{color:var(--accent)}
.utitle{flex:1;font-size:1.02rem;font-weight:600;letter-spacing:-.01em}
.urange{font-family:var(--mono);font-size:.6rem;color:var(--t4);white-space:nowrap}
.umeta{font-family:var(--mono);font-size:.6rem;color:var(--t4);white-space:nowrap}
.unit.current .umeta{color:var(--t3)}
.utag{font-family:var(--mono);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;padding:.16rem .5rem;border-radius:100px;font-weight:600;white-space:nowrap}
.utag.active{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-bdr)}
.utag.next{background:var(--bg);color:var(--t2);border:1px solid var(--bdr)}
.utag.planned{background:var(--bg);color:var(--t4)}
.utag.done{background:var(--review-bg);color:var(--done)}
.utag.fresh{background:var(--accent);color:var(--accent-fg,#fff);border:1px solid transparent}
.chev{width:16px;height:16px;color:var(--t4);transition:transform .35s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
.unit.open .chev{transform:rotate(180deg);color:var(--t3)}
.ubody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1)}
.unit.open .ubody{grid-template-rows:1fr}
.ubody-inner{overflow:hidden;border-radius:0 0 var(--r) var(--r);opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .3s}
.unit.open .ubody-inner{opacity:1;transform:none;transition-delay:.06s}
.ucontent{border-top:1px solid var(--bdr);overflow-x:auto;-webkit-overflow-scrolling:touch}

.ltable{width:100%;border-collapse:collapse;font-size:.88rem}
.ltable th{font-family:var(--mono);font-size:.6rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  color:var(--t3);padding:.55rem 1rem;text-align:left;border-bottom:1px solid var(--bdr);white-space:nowrap;background:rgba(var(--bgrgb),.55)}
.ltable th:first-child{width:2.6rem;text-align:center}
.th-topic{min-width:250px}.th-extra{min-width:220px}
.ltable td{padding:.65rem 1rem;vertical-align:top;border-bottom:1px solid var(--bdr);
  background:linear-gradient(var(--tint),var(--tint)),rgba(var(--sf),var(--ra))}
.ltable tr:last-child td{border-bottom:none}
.ltable tbody tr{--ra:var(--ra0,.5);--tint:transparent;transition:--ra .2s,--tint .2s}
.ltable tbody tr:hover{--ra:.9;--tint:var(--review-bg)}
.ltable tr.is-test,.ltable tr.is-exam{--tint:var(--test-bg)}
.ltable tbody tr.is-test,.ltable tbody tr.is-exam{--ra:.95}
.ltable tr.is-quiz{--tint:var(--quiz-bg)}
.ltable tr.is-pquiz{--tint:var(--pquiz-bg)}
.ltable tr.is-review{--tint:var(--review-bg)}
.ltable tbody tr.is-today{--ra:.97;--tint:var(--accent-dim)}
.ltable tr.is-today td:first-child{box-shadow:inset 3px 0 0 var(--accent);border-radius:8px 0 0 8px}
.ltable tr.is-today td:last-child{border-radius:0 8px 8px 0}
.td-num{font-family:var(--mono);font-size:.72rem;color:var(--t4);text-align:center;font-variant-numeric:tabular-nums}
.is-today .td-num{color:var(--accent);font-weight:600}
.td-date{font-family:var(--mono);font-size:.7rem;color:var(--t2);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.td-date .dow{display:block;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--t4);line-height:1.3}
.td-date .dt{display:block}
.today-pill{display:inline-block;margin-top:.2rem;font-family:var(--mono);font-size:.52rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);border:1px solid var(--accent-bdr);background:var(--accent-dim);border-radius:100px;padding:.05rem .4rem;font-weight:600}
.topic{font-weight:600;font-size:.98rem;letter-spacing:-.01em}
.badge{display:inline-block;font-family:var(--mono);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;
  padding:.1rem .45rem;border-radius:4px;font-weight:600;margin-left:.4rem;vertical-align:1px}
.badge.test{background:#b04854;color:#fff}
.badge.quiz{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-bdr)}
.badge.pquiz{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-bdr)}
.lgroup{display:flex;flex-direction:column;gap:.22rem;margin-top:.25rem}
.ico{width:.95em;height:.95em;flex-shrink:0;display:inline-block;vertical-align:-.12em;transition:transform .15s}
.dlink{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;line-height:1.35;transition:opacity .15s}
.dlink .lt{background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/0 1px;transition:background-size .2s;padding-bottom:1px}
.dlink:hover{opacity:.85}
.dlink:hover .lt{background-size:100% 1px}
.dlink:hover .ico.arrow{transform:translate(1px,-1px)}
.dlink:hover .ico.play{transform:scale(1.15)}
.dlink:hover .ico.pencil{transform:rotate(-8deg)}
.dlink.ans:hover{opacity:1;color:var(--warn-fg)}
.lrow{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.newp{display:inline-flex;align-items:center;font-family:var(--mono);font-size:.52rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  color:var(--accent-fg,#fff);background:var(--accent);border-radius:100px;padding:.1rem .45rem;line-height:1.4}
.xitem{display:flex;flex-wrap:wrap;align-items:center;gap:.15rem .45rem}
.xans{display:inline-flex;align-items:center;gap:.25rem;font-size:.64rem;font-weight:600;color:var(--ans);padding:.06rem .5rem .06rem .4rem;
  border:1px solid var(--warn-bdr);border-radius:100px;background:var(--warn-bg);line-height:1.5;transition:transform .15s,box-shadow .15s}
.xans:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.xans:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.dlink.note{color:var(--accent);font-weight:600}
.dlink.ans{color:var(--ans);font-size:.76rem;font-weight:500}
.dlink.pend{color:var(--t4);cursor:default;font-size:.76rem}
.dlink.pend:hover{opacity:1}
.dlink.pend .lt{background:none}
.dlink.vid{color:var(--vid);font-size:.78rem}
.dlink.doc{color:var(--t2);font-size:.78rem}
.dlink.skills{color:var(--skills);font-size:.78rem;font-weight:600}
.dlink:hover .ico.layers{transform:translateY(-1px)}
.dlink.eqao{color:var(--eqao);font-size:.78rem;font-weight:600}

/* Hover tooltips */
.tipwrap{position:relative;display:inline-flex}
.tip{display:flex;position:absolute;top:calc(100% + 6px);left:0;z-index:30;white-space:nowrap;
  padding:.28rem .6rem;border-radius:6px;font-size:.64rem;font-weight:500;font-family:var(--sans);
  pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.12);align-items:center;gap:.35rem;
  opacity:0;visibility:hidden;transform:translateY(-4px) scale(.96);transform-origin:top left;transition:opacity .12s,transform .12s,visibility 0s .12s}
.tip.info{background:var(--ink);color:var(--bg)}
.tip.warn{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-bdr)}
.tip.hazard{background:var(--haz-bg);color:var(--haz-fg);border:1px solid var(--haz-bdr)}
.tip.hazard .ico.haz{width:1rem;height:1rem;flex-shrink:0}
.tip.hazard .tgo{background:var(--haz-fg)}
.tip .skull{width:1rem;height:1rem;flex-shrink:0}
.tip.up{top:auto;bottom:calc(100% + 6px);transform:translateY(4px) scale(.96);transform-origin:bottom left}
.tip .tgo{display:none;font:inherit;font-weight:700;font-size:.7rem;background:var(--warn-fg);color:#fff;border:none;border-radius:6px;padding:.3rem .7rem;cursor:pointer;white-space:nowrap}
@media(hover:hover){.tipwrap:hover .tip{opacity:1;visibility:visible;transform:none;transition:opacity .12s,transform .12s}}
.tipwrap:focus-within .tip{opacity:1;visibility:visible;transform:none;transition:opacity .12s,transform .12s}
/* Armed on touch: the warning becomes a fixed sheet at the bottom with a Continue button */
.tipwrap.armed .tip{opacity:1;visibility:visible;pointer-events:auto;position:fixed;left:.75rem;right:.75rem;top:auto;bottom:1rem;z-index:400;
  transform:none;white-space:normal;max-width:none;padding:.75rem .9rem;font-size:.82rem;gap:.6rem;box-shadow:0 12px 32px rgba(0,0,0,.25);border-radius:12px;
  animation:sheetup .22s cubic-bezier(.2,.7,.2,1) backwards}
.tipwrap.armed .tip .tgo{display:inline-block;margin-left:auto}
body.armed .fab{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(14px)}
@keyframes sheetup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@keyframes rowflash{0%{--tint:rgba(var(--curve),.3)}100%{--tint:transparent}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rowin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.top-bar,header,.hero,.sbar,.unit{animation:rise .45s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
.unit.open tbody tr{animation:rowin .3s ease-out backwards;animation-delay:calc(min(var(--i,0),16)*22ms + .08s)}
.unit.open tbody tr.fin{animation:fadein .25s both}
.unit.open tbody tr.flash{animation:rowflash 1.8s ease-out}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}


.fab{position:fixed;bottom:1.5rem;right:1.5rem;z-index:200;background:var(--accent);color:var(--accent-fg);border:none;border-radius:100px;
  padding:.55rem 1rem;font-family:var(--mono);font-size:.68rem;font-weight:600;cursor:pointer;
  box-shadow:0 4px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:.35rem;
  opacity:0;visibility:hidden;transform:translateY(14px);pointer-events:none;transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .25s,visibility 0s .3s}
.fab.visible{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .25s}
.fab.visible:hover{transform:translateY(-2px)}
.fab:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

@media(max-width:768px){
  .page{padding:2rem .75rem}header h1{font-size:1.9rem}
  .top-bar{margin:-2rem -.75rem 1.5rem;padding:.5rem .75rem}
  #bg{opacity:.6}
  .urange{display:none}
  .fab{bottom:1rem;right:1rem}
  .uhead{padding:.8rem .9rem;gap:.5rem;flex-wrap:wrap}
  .umeta{flex-basis:100%;order:10;margin-top:-.2rem}
  .ucontent{overflow:visible}
  .ltable,.ltable tbody{display:block}
  .ltable thead{display:none}
  .ltable tr{display:grid;grid-template-columns:auto 1fr;column-gap:.55rem;row-gap:.1rem;align-items:center;padding:.85rem .9rem .95rem;border-bottom:1px solid var(--bdr);
    background:linear-gradient(var(--tint),var(--tint)),rgba(var(--sf),var(--ra))}
  .ltable tr:last-child{border-bottom:none}
  .ltable td{display:block;padding:0;border:none;background:none}
  .td-num{grid-row:1;grid-column:1;width:auto;text-align:left;font-size:.62rem;padding:.08rem .5rem;border:1px solid var(--bdr);border-radius:100px;color:var(--t3)}
  .td-num::before{content:"Day "}
  .td-date{grid-row:1;grid-column:2;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
  .td-date br{display:none}
  .td-date .dow,.td-date .dt{display:inline;font-size:.7rem;color:var(--t2);text-transform:none;letter-spacing:0}
  .td-date .dow::after{content:", "}
  .today-pill{margin:0 0 0 .15rem}
  .td-topic{grid-column:1/-1;margin-top:.4rem}
  .td-extra{grid-column:1/-1;margin-top:.5rem;padding-top:.5rem;border-top:1px dashed var(--bdr)}
  .td-extra.empty{display:none}
  .ltable tr.is-today{box-shadow:inset 3px 0 0 var(--accent)}
  .ltable tr.is-today td,.ltable tr.is-today td:first-child,.ltable tr.is-today td:last-child{background:none;box-shadow:none;border-radius:0}
  .ltable tr.is-today .td-num{border-color:var(--accent-bdr);color:var(--accent)}
  .dlink{font-size:.86rem}.dlink.ans,.dlink.pend{font-size:.8rem}.dlink.vid,.dlink.doc,.dlink.eqao{font-size:.82rem}
  .xans{font-size:.68rem}
  .hero .acts .btn{flex:1 1 auto;justify-content:center}
  .ess a{flex:1 1 auto;justify-content:center}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<body>
<canvas id="bg" aria-hidden="true"></canvas>
<svg id="vcur" aria-hidden="true"><g class="ghosts"></g><g class="theme"></g><text class="lbl"></text></svg>
<div class="page">
  <div class="top-bar" style="--i:0">
    <span class="lbl">Course</span>
    <div class="ptrack"><div class="pfill" id="pf"></div></div>
    <span class="ptxt" id="pt"></span>
  </div>

  <header style="--i:1">
    <div class="htop">
      <span class="chip">MTH1W</span>
      <div class="hacts">
        <button class="hbtn" id="dmBtn"></button>
        <button class="hbtn" id="expBtn">Expand All</button>
        <button class="hbtn" id="helpBtn" aria-expanded="false" aria-controls="help" aria-label="What the links and colours mean">?</button>
        <div class="help" id="help" role="dialog" aria-label="Legend"></div>
      </div>
    </div>
    <h1>Grade 9 <em>Mathematics</em></h1>
    <div class="sub" id="subTitle"></div>
    <nav class="ess" id="ess" aria-label="Course essentials"></nav>
  </header>

  <section class="hero" id="hero" hidden style="--i:2"></section>

  <div class="sbar" style="--i:3">
    <span class="si" id="siIco"></span>
    <input type="text" placeholder="Filter lessons…" id="si">
    <span class="sc" id="sc"></span>
  </div>

  <div id="units"></div>
  <div class="nomatch-msg" id="nomatch" hidden>No lessons match. Try a topic word.</div>

</div>

<button class="fab" id="fab"></button>

<script src="data.js"></script>
<script>
/* ══════════ Date & state ══════════ */
function todayISO(){
  const p=new URLSearchParams(location.search).get("today");
  if(p&&/^\d{4}-\d{2}-\d{2}$/.test(p))return p; // debug: ?today=2026-09-10
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
const TODAY=todayISO();
function stateOf(day){
  if(!day.iso)return "undated";
  return day.iso<TODAY?"past":day.iso===TODAY?"today":"future";
}
function fmtDate(iso){
  if(!iso)return "—";
  return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
function fmtDate2(iso){
  if(!iso)return "—";
  const d=new Date(iso+"T12:00:00");
  return `<span class="dow">${d.toLocaleDateString("en-US",{weekday:"short"})}</span><span class="dt">${d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>`;
}
function fmtShort(iso){
  return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function unitLabel(u,i){return u.noNumber?u.name:"Unit "+(i+1);}
function unitRange(u){
  const dated=u.days.filter(d=>d.iso);
  if(!dated.length)return "";
  return fmtShort(dated[0].iso)+" – "+fmtShort(dated[dated.length-1].iso);
}

/* which unit is current: the one containing today or the next class */
const allDated=COURSE.units.flatMap((u,i)=>u.days.filter(d=>d.iso).map(d=>({u:i,iso:d.iso,day:d})));
allDated.sort((a,b)=>a.iso<b.iso?-1:1);
const heroEntry=allDated.find(e=>e.iso===TODAY)||allDated.find(e=>e.iso>TODAY)||null;
const currentUnit=heroEntry?heroEntry.u:COURSE.units.length-1;
const daysDone=allDated.filter(e=>e.iso<=TODAY).length;
const daysTotal=COURSE.units.reduce((n,u)=>n+u.days.length,0);


/* ══════════ Icons (inline SVG so they look the same on every phone) ══════════ */
const ICONS={
  arrow:'<path d="M7 17L17 7M9 7h8v8"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  play:'<path d="M7 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>',
  pencil:'<path d="M4 20l4-1L18.5 8.5a2.1 2.1 0 0 0-3-3L5 16l-1 4z"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  skull:'<path fill="currentColor" stroke="none" fill-rule="evenodd" d="M12 2a8 8 0 0 0-8 8c0 2.6 1.2 4.6 3 6v3a1 1 0 0 0 1 1h1v-2h2v2h2v-2h2v2h1a1 1 0 0 0 1-1v-3c1.8-1.4 3-3.4 3-6a8 8 0 0 0-8-8zM8.5 13a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm7 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>',
  layers:'<path d="M12 3.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12.5l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>',
  doc:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9.5 13h6M9.5 17h6"/>',
  list:'<path d="M10 6.5h10M10 12h10M10 17.5h10"/><path d="M4 6.5l1.2 1.2 2.3-2.4M4 12l1.2 1.2 2.3-2.4M4 17.5l1.2 1.2 2.3-2.4"/>',
  calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/>',
  haz:'<path d="M12 3.5L2.5 20h19z"/><path d="M12 9.5v4.5M12 17h.01"/>',
};
function ico(name,cls){
  return `<svg class="ico ${name}${cls?" "+cls:""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
}

/* ══════════ Link rendering ══════════ */
const WARN=ico("skull","skull")+'<span>Do not look if you haven’t done the practice</span><button class="tgo" type="button">Continue</button>';
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function live(t,url,cls,icon,warn){
  const a=`<a class="dlink ${cls}" href="${esc(url)}" target="_blank" rel="noopener"${warn?' data-warn':''}>${ico(icon)}<span class="lt">${t}</span></a>`;
  return warn?`<span class="tipwrap">${a}<span class="tip warn">${WARN}</span></span>`:a;
}
function pend(t,icon){
  return `<span class="tipwrap"><span class="dlink pend" tabindex="0">${ico(icon)}<span class="lt">${t}</span></span><span class="tip info">Coming soon</span></span>`;
}
function extraLink(e){
  const[t,url,kind]=e;
  if(kind==="vid")return live(t,url,"vid","play",false);
  if(kind==="ans")return live(t,url,"ans","check",true);
  if(kind==="skills")return live(t,url,"skills","layers",false);
  if(kind==="eqao")return live(t,url,"eqao","pencil",false);
  return live(t,url,"doc","arrow",false);
}
/* A worksheet's answers ride along as a chip on the same line instead of a stray "Answers" row */
function extrasHTML(list){
  const items=[];
  list.forEach(e=>{
    if(!e)return;
    const kind=e[2];
    if(kind==="ans"&&items.length&&items[items.length-1].kind!=="ans"){items[items.length-1].ans.push(e);return}
    items.push({kind,e,ans:[]});
  });
  return items.map(it=>{
    const main=extraLink(it.e);
    if(!it.ans.length)return main;
    const chips=it.ans.map(a=>`<span class="tipwrap"><a class="xans" data-warn href="${esc(a[1])}" target="_blank" rel="noopener">${ico("check")}${a[0]}</a><span class="tip warn">${WARN}</span></span>`).join("");
    return `<div class="xitem">${main}${chips}</div>`;
  }).join("");
}
/* Keys released today or in the last few days get a pill so students can see what is new */
function daysAgo(iso){return Math.round((new Date(TODAY+"T12:00:00")-new Date(iso+"T12:00:00"))/864e5)}
function ansState(day){
  if(!day.ans||!day.iso)return "";
  const n=daysAgo(day.iso);
  return n===0?"today":(n>0&&n<=3)?"new":"";
}
function newPill(day){
  const s=ansState(day);
  return s==="today"?'<span class="newp">Posted today</span>':s==="new"?'<span class="newp">New</span>':"";
}
function noteLinks(day){
  const links=[];
  const hasNote=day.num||day.noteLabel;
  if(hasNote){
    const label=day.noteLabel||`${day.num} Blank Note & Practice Problems`;
    links.push(day.note?live(label,day.note,"note","arrow",false):pend(label,"arrow"));
    const ansLabel=day.ansLabel||"Answers";
    if(day.ans)links.push(`<span class="lrow">${live(ansLabel,day.ans,"ans","check",true)}${newPill(day)}</span>`);
    else links.push(pend(ansLabel,"check"));
  }
  return links;
}

/* ══════════ Render units ══════════ */
/* Glass opacity for a day: solid at today, nearly so either side, fading
   with distance; past days thinnest. Quiz and review days a touch firmer.
   Test, exam and today are pinned solid in CSS. */
function rowAlpha(day,st){
  if(!day.iso)return .5;
  const n=Math.abs(daysAgo(day.iso));
  let a=st==="past"?.4:.52;
  if(n===1)a=.84;else if(n===2)a=.74;else if(n===3)a=.64;
  if(day.flag==="quiz"||day.flag==="pquiz")a=Math.min(.9,a+.12);
  if(day.flag==="review")a=Math.min(.9,a+.08);
  return a;
}
function dayRow(day,i){
  const st=stateOf(day);
  const cls=[day.flag==="test"?"is-test":"",day.flag==="quiz"?"is-quiz":"",day.flag==="pquiz"?"is-pquiz":"",st==="today"?"is-today":""].join(" ");
  let badge="";
  if(day.flag==="test")badge='<span class="badge test">Test</span>';
  if(day.flag==="quiz")badge='<span class="badge quiz">Quiz</span>';
  if(day.flag==="pquiz")badge='<span class="badge pquiz">Practice Quiz</span>';
  const links=noteLinks(day);
  const extras=extrasHTML(day.extras||[]);
  const heroId=heroEntry&&day===heroEntry.day?' id="heroDayRow"':"";
  return `<tr class="${cls}"${heroId} style="--i:${i};--ra0:${rowAlpha(day,st)}">
    <td class="td-num">${day.d}</td>
    <td class="td-date">${fmtDate2(day.iso)}${st==="today"?'<br><span class="today-pill">Today</span>':""}</td>
    <td class="td-topic"><span class="topic">${day.topic}</span>${badge}<div class="lgroup">${links.join("")}</div></td>
    <td class="td-extra${extras?"":" empty"}"><div class="lgroup">${extras}</div></td>
  </tr>`;
}
function unitMeta(u){
  const dated=u.days.filter(d=>d.iso);
  const done=dated.filter(d=>d.iso<=TODAY).length;
  const res=u.days.reduce((n,d)=>n+(d.note?1:0)+(d.ans?1:0)+(d.extras||[]).filter(Boolean).length,0);
  return `${done} / ${u.days.length} days · ${res} resource${res===1?"":"s"}`;
}
function freshTag(u){
  const n=u.days.filter(ansState).length;
  return n?`<span class="utag fresh">${n} new</span>`:"";
}
function unitTag(u,i){
  const lastIso=u.days.filter(d=>d.iso).map(d=>d.iso).pop();
  if(i===currentUnit)return '<span class="utag active">Current</span>';
  if(lastIso&&lastIso<TODAY)return '<span class="utag done">Done</span>';
  if(i===currentUnit+1)return '<span class="utag next">Up Next</span>';
  return '<span class="utag planned">Planned</span>';
}
function render(){
  document.getElementById("subTitle").textContent=COURSE.sub;
  document.getElementById("units").innerHTML=COURSE.units.map((u,i)=>{
    const open=i===currentUnit?"open":"";
    const cur=i===currentUnit?"current":"";
    return `<section class="unit ${open} ${cur}" id="u${i}" style="--i:${i+4}">
      <button class="uhead" aria-expanded="${i===currentUnit}" onclick="toggleU(this)">
        ${u.noNumber?"":`<span class="unum">Unit ${i+1}</span>`}
        <span class="utitle">${u.name}</span>
        <span class="urange">${unitRange(u)}</span>
        <span class="umeta">${unitMeta(u)}</span>
        ${freshTag(u)}${unitTag(u,i)}
        <svg class="chev" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="ubody"><div class="ubody-inner">
        <div class="ucontent"><table class="ltable">
          <thead><tr><th>Day</th><th>Date</th><th class="th-topic">Topic · Note &amp; Practice Problems</th><th class="th-extra">Extra Practice &amp; Resources</th></tr></thead>
          <tbody>${u.days.map(dayRow).join("")}</tbody>
        </table></div>
      </div></div>
    </section>`;
  }).join("");
}
function toggleU(btn){
  const u=btn.closest(".unit");u.classList.toggle("open");
  btn.setAttribute("aria-expanded",u.classList.contains("open"));
}

/* ══════════ Course essentials ══════════
   COURSE.essentials = [[label, url, kind, warn?], ...]; kind is "outline",
   "routine" or "calc". A warn string rides on the link as a hazard tip (the
   pill itself stays plain): hover on desktop, and on a phone the first tap
   raises it as a sheet with Continue (the same data-warn mechanism the answer
   keys use). */
function renderEssentials(){
  const el=document.getElementById("ess");
  const list=(COURSE.essentials||[]).filter(Boolean);
  if(!list.length){el.hidden=true;return}
  const ICO={outline:"doc",routine:"list",calc:"calc"};
  el.innerHTML=list.map(e=>{
    const[t,url,kind,warn]=e;
    const a=`<a href="${esc(url)}" target="_blank" rel="noopener"${warn?' data-warn':''}>${ico(ICO[kind]||"arrow")}<span>${t}</span></a>`;
    return warn?`<span class="tipwrap">${a}<span class="tip hazard">${ico("haz","haz")}<span>${esc(warn)}</span><button class="tgo" type="button">Continue</button></span></span>`:a;
  }).join("");
}

/* ══════════ Hero ══════════ */
function renderHero(){
  const h=document.getElementById("hero");
  if(!heroEntry){h.hidden=true;return}
  const {u,day}=heroEntry;
  const isToday=day.iso===TODAY;
  const label=isToday?"Today":"Next class";
  const btns=[];
  const hasNote=day.num||day.noteLabel;
  if(hasNote){
    const nl=day.noteLabel||`${day.num} Blank Note & Practice Problems`;
    btns.push(day.note
      ?`<a class="btn pri" href="${esc(day.note)}" target="_blank" rel="noopener">${ico("arrow")} ${nl}</a>`
      :`<span class="tipwrap"><span class="btn dis">${ico("arrow")} ${nl}</span><span class="tip info up">Coming soon</span></span>`);
    // Answers only appears here once it's actually linked
    if(day.ans){
      const al=day.ansLabel||"Answers";
      btns.push(`<span class="tipwrap"><a class="btn ansb" data-warn href="${esc(day.ans)}" target="_blank" rel="noopener">${ico("check")} ${al}</a><span class="tip warn up">${WARN}</span></span>`);
    }
  }
  // Until today's key is up, the most recently released key is one tap away
  if(!day.ans){
    const latest=[...allDated].reverse().find(e=>e.iso<=TODAY&&e.day.ans);
    if(latest){
      const ll=latest.day.num?`Latest answers · ${latest.day.num}`:`Latest answers · ${latest.day.ansLabel||latest.day.topic}`;
      btns.push(`<span class="tipwrap"><a class="btn ghost" data-warn href="${esc(latest.day.ans)}" target="_blank" rel="noopener">${ico("check")} ${ll}</a><span class="tip warn up">${WARN}</span></span>`);
    }
  }
  h.hidden=false;
  h.setAttribute("role","link");
  h.setAttribute("tabindex","0");
  h.setAttribute("aria-label",`Jump to ${day.topic} in the course table`);
  h.innerHTML=`
    <div class="eyebrow"><span class="live"></span>${label} · ${fmtDate(day.iso)} · ${unitLabel(COURSE.units[u],u)}, Day ${day.d}</div>
    <h2>${day.topic}</h2>
    ${btns.length?`<div class="acts">${btns.join("")}</div>`:""}`;
  function jump(){
    const unit=document.getElementById("u"+u);
    if(unit&&!unit.classList.contains("open")){
      unit.classList.add("open");
      unit.querySelector(".uhead").setAttribute("aria-expanded","true");
    }

/* ══════════ Animated background: pseudocode on graph paper ══════════
   EQAO-register pseudocode snippets type themselves out slowly on
   faint graph paper, pause, print their output, hold, and fade.
   Every output is correct, every snippet is Grade 9 mathematics.
   Calm by design: no cursor-chasing, no click effects, slow pace.
   Reduced-motion users get a static drawing instead. */
const cv=document.getElementById("bg"),cx=cv.getContext("2d");
let W,H,DPR,RGB="2,132,199",ALPHA=.1,MX=-1e4,MY=-1e4;
if(window.matchMedia("(hover:hover) and (pointer:fine)").matches){
  document.addEventListener("mousemove",e=>{MX=e.clientX;MY=e.clientY},{passive:true});
  document.documentElement.addEventListener("mouseleave",()=>{MX=MY=-1e4});
}
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const MONO="13px 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace";
function bgColors(){
  const s=getComputedStyle(document.documentElement);
  RGB=(s.getPropertyValue("--curve")||RGB).trim();
  ALPHA=parseFloat(s.getPropertyValue("--curve-a"))||ALPHA;
}
function sizeBg(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cx.setTransform(DPR,0,0,DPR,0,0);
}
const SNIPS=[
  {lines:["store 8 as base","store 5 as height","output base * height / 2"],out:"20"},
  {lines:["store 7 as width","store 4 as length","output 2 * width + 2 * length"],out:"22"},
  {lines:["store 6 as a","store 8 as b","output √(a*a + b*b)"],out:"10"},
  {lines:["store 0 as total","repeat 4 times","  store total + 5 as total","output total"],out:"20"},
  {lines:["store 2 as m","store 1 as b","store 3 as x","output m * x + b"],out:"7"},
  {lines:["store 40 as price","output price * 0.85"],out:"34"},
  {lines:["store 3 as x","store 9 as y","if y = 2 * x + 3",'  output "on the line"',"else",'  output "off the line"'],out:"on the line"},
  {lines:["store 5 as rise","store 2 as run","output rise / run"],out:"2.5"},
  {lines:["store 2 as sideLength","output sideLength^3","output 6 * sideLength^2"],out:"8   24"},
  {lines:["store 200 as principal","output principal * 0.05 * 3"],out:"30"},
  {lines:["store 0 as x","repeat 3 times","  output 4 * x + 1","  store x + 1 as x"],out:"1   5   9"},
];
const LINE_H=21,CHAR_MS=110,LINE_PAUSE=340,OUT_DELAY=1100,HOLD=9000,FADE=3200;
const cards=[];
let nCards=3;
function spawnCard(i,now,delay){
  const used=cards.filter((c,j)=>c&&j!==i).map(c=>c.s);
  const pool=SNIPS.filter(s=>!used.includes(s));
  const s=pool[Math.floor(Math.random()*pool.length)]||SNIPS[0];
  const times=[];let t=0;
  s.lines.forEach(l=>{for(let k=0;k<l.length;k++){t+=CHAR_MS*(.6+Math.random()*.9);times.push(t)}t+=LINE_PAUSE});
  cx.font=MONO;
  const cw=Math.max(...s.lines.map(l=>cx.measureText(l).width))+20;
  const ch=(s.lines.length+2)*LINE_H;
  const bandW=W/nCards;
  const x=Math.min(Math.max(bandW*i+16+Math.random()*Math.max(bandW-cw-32,1),12),Math.max(W-cw-12,12));
  const y=60+Math.random()*Math.max(H-ch-140,40);
  return {s,times,typeEnd:t,x,y,born:now+(delay||0)};
}
function drawGrid(){
  const s=26;
  cx.lineWidth=1;
  const minor=new Path2D(),major=new Path2D();
  for(let x=.5,i=0;x<W;x+=s,i++){
    const p=i%5===0?major:minor;
    p.moveTo(x,0);p.lineTo(x,H);
  }
  for(let y=.5,i=0;y<H;y+=s,i++){
    const p=i%5===0?major:minor;
    p.moveTo(0,y);p.lineTo(W,y);
  }
  cx.strokeStyle=`rgba(${RGB},${ALPHA*.35})`;cx.stroke(minor);
  cx.strokeStyle=`rgba(${RGB},${ALPHA*.7})`;cx.stroke(major);
  if(MX>-1e3){
    const g=cx.createRadialGradient(MX,MY,0,MX,MY,170);
    g.addColorStop(0,`rgba(${RGB},${Math.min(ALPHA*2.4,.3)})`);g.addColorStop(1,`rgba(${RGB},0)`);
    cx.strokeStyle=g;cx.stroke(minor);cx.stroke(major);
  }
}
function drawCard(c,t){
  const age=t-c.born;
  if(age<0)return true;
  const total=c.typeEnd+OUT_DELAY+HOLD+FADE;
  if(age>total)return false;
  const fade=age>c.typeEnd+OUT_DELAY+HOLD?Math.max(0,1-(age-c.typeEnd-OUT_DELAY-HOLD)/FADE):1;
  cx.font=MONO;
  const txtA=Math.min(ALPHA*2,.3)*fade;
  let idx=0,curLine=-1,curText="";
  c.s.lines.forEach((l,li)=>{
    let shown="";
    for(let k=0;k<l.length;k++){if(age>=c.times[idx])shown+=l[k];idx++}
    if(shown){
      cx.fillStyle=`rgba(${RGB},${txtA})`;
      cx.fillText(shown,c.x,c.y+li*LINE_H);
      curLine=li;curText=shown;
    }
  });
  if(age<c.typeEnd&&!reduce&&curLine>=0&&Math.floor(t/560)%2===0){
    cx.fillStyle=`rgba(${RGB},${Math.min(ALPHA*3,.4)*fade})`;
    cx.fillRect(c.x+cx.measureText(curText).width+2,c.y+curLine*LINE_H-11,7,14);
  }
  if(age>=c.typeEnd+OUT_DELAY){
    cx.fillStyle=`rgba(${RGB},${Math.min(ALPHA*3.2,.42)*fade})`;
    cx.fillText("» "+c.s.out,c.x,c.y+(c.s.lines.length+1)*LINE_H);
  }
  return true;
}
function draw(t){
  cx.clearRect(0,0,W,H);
  drawGrid();
  for(let i=0;i<cards.length;i++){
    if(!drawCard(cards[i],t))cards[i]=spawnCard(i,t,1500+Math.random()*3000);
  }
}
function seedCards(now){
  nCards=W<720?2:3;
  cards.length=0;
  for(let i=0;i<nCards;i++)cards.push(spawnCard(i,now,i*5200));
}
let bgRaf=0;
function loop(now){draw(now);bgRaf=requestAnimationFrame(loop)}
document.addEventListener("visibilitychange",()=>{
  if(reduce)return;
  if(document.hidden){cancelAnimationFrame(bgRaf);bgRaf=0}
  else if(!bgRaf)bgRaf=requestAnimationFrame(loop);
});
function drawStatic(){
  cards.forEach(c=>{c.born=-(c.typeEnd+OUT_DELAY+HOLD*.5)});
  draw(0);
}
sizeBg();bgColors();seedCards(performance.now());
window.addEventListener("resize",()=>{sizeBg();seedCards(performance.now());if(reduce)drawStatic()});
if(reduce)drawStatic();else bgRaf=requestAnimationFrame(loop);
/* ══════════ MTH1W cursor: a pointer that gets a little long ══════════
   Grade 9 keeps it simple: a small round-tipped pointer that trails a
   short tail behind the direction of travel and lengthens a little with
   speed, taking a link's colour while over it. Nothing else. */
const THEME={
  samples:false,
  subject(){return ""},
  init(S){S.e={tailh:S.el("line","tailh"),tail:S.el("line","tail"),pt:S.el("circle","pt",{r:3.6})}},
  burst(){},
  frame(S){
    const e=S.e,{mx,my,c,boost,sp}=S,L=7+2*boost+Math.min(sp,36)*.75,dx=-Math.cos(S.ang),dy=-Math.sin(S.ang);
    [e.tailh,e.tail].forEach(l=>{l.setAttribute("x1",mx);l.setAttribute("y1",my);l.setAttribute("x2",mx+dx*L);l.setAttribute("y2",my+dy*L)});
    e.tail.setAttribute("stroke",c);e.tail.setAttribute("stroke-width",2.4+boost);
    e.pt.setAttribute("cx",mx);e.pt.setAttribute("cy",my);e.pt.setAttribute("r",3.6+boost);e.pt.setAttribute("fill",c);
  }
};

/* ══════════ Cursor framework (shared) ══════════
   On a mouse-and-trackpad machine the pointer is replaced by the site's own
   glyph, drawn by THEME (defined above). This part tracks the pointer and
   its velocity, which link it is over and that link's unit, grows a
   "boost" while over a link, drops samples along the path, spots a hard
   stop after a fast run, keeps a pool of small particles, and places the
   readout. Phones and tablets, text boxes, and reduced-motion users keep
   the normal pointer. */
(function(){
  if(!window.matchMedia("(hover:hover) and (pointer:fine)").matches||REDUCE)return;
  const NS="http://www.w3.org/2000/svg",svg=document.getElementById("vcur");
  const Q=c=>svg.querySelector(c);
  const gwrap=Q(".ghosts"),txt=Q(".lbl");
  const SEL='a,button,[role="link"],.dlink.pend,.tipwrap',FAST=14;
  const pool=[],live=[];
  for(let i=0;i<96;i++){const r=document.createElementNS(NS,"rect");r.style.opacity=0;gwrap.appendChild(r);pool.push({el:r})}
  const S={mx:-100,my:-100,vx:0,vy:0,sp:0,ang:-2.3,fast:0,boost:0,on:false,rect:null,kind:"",c:"",now:0,samples:[],label:"",layer:Q(".theme"),NS};
  /* o: {vx,vy,w,h,rx,rot,grow,burst} */
  S.drop=function(x,y,c,life,o){
    const g=pool.pop();if(!g)return;
    o=o||{};const w=o.w||5.2,h=o.h||w;
    Object.assign(g,{x,y,born:S.now,life,vx:o.vx||0,vy:o.vy||0,w,h,rot:o.rot||0,grow:o.grow||0,sample:!o.burst&&!o.vx&&!o.vy});
    g.el.setAttribute("rx",o.rx==null?Math.min(w,h)/2:o.rx);g.el.setAttribute("fill",c);
    live.push(g);
  };
  S.gauss=()=>{let s=0;for(let i=0;i<6;i++)s+=Math.random();return (s-3)/Math.SQRT1_2};
  S.el=(tag,cls,attrs)=>{const e=document.createElementNS(NS,tag);if(cls)e.setAttribute("class",cls);for(const k in attrs||{})e.setAttribute(k,attrs[k]);S.layer.appendChild(e);return e};
  let px=-100,py=-100,ldx=-1e9,ldy=-1e9,pk=0,burst=false,seen=false,tgt=null,tcol="",hide=false,raf=0,last=0,acc="",accN=0;
  function accent(){if(!accN--){accN=30;acc=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()}return acc}
  function subject(t){
    const u=t.closest(".unit");
    const name=u?u.querySelector(".utitle").textContent:(t.closest("#hero")&&heroEntry)?COURSE.units[heroEntry.u].name:"";
    return THEME.subject(name);
  }
  THEME.init(S);
  document.addEventListener("mousemove",e=>{
    S.mx=e.clientX;S.my=e.clientY;
    if(!seen){seen=true;px=S.mx;py=S.my;ldx=S.mx;ldy=S.my;document.body.classList.add("vc");svg.classList.add("on")}
    if(!raf)raf=requestAnimationFrame(tick);
  },{passive:true});
  document.addEventListener("mouseover",e=>{
    if(!e.target||!e.target.closest)return;
    const t=e.target.closest(SEL);
    hide=!!e.target.closest("input,textarea,select");
    if(t!==tgt){
      tgt=t;tcol=t&&t.matches(".dlink,.xans,.ess a,.btn,.tgo")?getComputedStyle(t).color:"";
      S.kind=t?subject(t):"";S.entered=performance.now();
      if(t&&THEME.enter)THEME.enter(S);
    }
  });
  document.addEventListener("mouseout",e=>{if(!e.relatedTarget){tgt=null;hide=false}});
  document.documentElement.addEventListener("mouseleave",()=>{svg.classList.remove("on");tgt=null});
  document.documentElement.addEventListener("mouseenter",()=>{if(seen){svg.classList.add("on");if(!raf)raf=requestAnimationFrame(tick)}});
  window.addEventListener("blur",()=>svg.classList.remove("on"));
  document.addEventListener("mousedown",()=>svg.classList.add("dn"));
  document.addEventListener("mouseup",()=>svg.classList.remove("dn"));
  function tick(now){
    raf=0;S.now=now;
    const dt=Math.min(now-last,64)||16;last=now;
    const dx=S.mx-px,dy=S.my-py;px=S.mx;py=S.my;
    S.vx+=(dx/dt*16-S.vx)*.4;S.vy+=(dy/dt*16-S.vy)*.4;
    S.sp=Math.hypot(S.vx,S.vy);
    if(S.sp>1.2){const ta=Math.atan2(S.vy,S.vx);let d=ta-S.ang;d=Math.atan2(Math.sin(d),Math.cos(d));S.ang+=d*.3}
    S.on=false;S.rect=null;
    if(tgt&&!hide){
      const r=tgt.getBoundingClientRect();
      if(S.mx<r.left-6||S.mx>r.right+6||S.my<r.top-6||S.my>r.bottom+6)tgt=null;
      else{S.on=true;S.rect=r}
    }
    S.boost+=((S.on?1:0)-S.boost)*.2;
    S.c=S.on&&tcol?tcol:accent();
    S.fast=Math.max(0,Math.min(1,(S.sp-FAST)/12));
    if(THEME.samples&&S.sp>.8&&!hide&&Math.hypot(S.mx-ldx,S.my-ldy)>=10){S.drop(S.mx,S.my,S.c,1400,THEME.sample?THEME.sample(S):null);ldx=S.mx;ldy=S.my}
    pk=Math.max(S.sp,pk*.94);
    if(pk>26&&S.sp<5&&!burst){burst=true;THEME.burst(S)}
    if(pk<10)burst=false;
    S.samples.length=0;
    for(let i=live.length-1;i>=0;i--){
      const g=live[i],age=now-g.born;
      if(age>g.life){g.el.style.opacity=0;live.splice(i,1);pool.push(g);continue}
      const t=age/g.life;g.x+=g.vx;g.y+=g.vy;g.vx*=.9;g.vy*=.9;
      const k=1+g.grow*t,w=g.w*k,h=g.h*k;
      g.el.setAttribute("x",g.x-w/2);g.el.setAttribute("y",g.y-h/2);g.el.setAttribute("width",w);g.el.setAttribute("height",h);
      if(g.rot)g.el.setAttribute("transform",`rotate(${g.rot+t*50} ${g.x} ${g.y})`);else g.el.removeAttribute("transform");
      g.el.style.opacity=(1-t)*.7;
      if(g.sample)S.samples.unshift(g);   // oldest first
    }
    S.hide=hide;S.label="";S.labelAt=null;S.labelOp=null;S.labelColor=null;
    THEME.frame(S);
    if(S.label&&(S.labelOp==null||S.labelOp>0)){
      txt.textContent=S.label;const at=S.labelAt||[S.mx+14,S.my-10];
      txt.setAttribute("x",at[0]);txt.setAttribute("y",at[1]);txt.setAttribute("fill",S.labelColor||S.c);
      txt.style.opacity=S.labelOp==null?1:S.labelOp;
    }else txt.style.opacity=0;
    svg.classList.toggle("hid",hide);
    if(svg.classList.contains("on"))raf=requestAnimationFrame(tick);
  }
})();

</script>
